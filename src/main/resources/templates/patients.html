<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.2.3/css/bootstrap.min.css">
</head>
<body>
 <div>
     <div class="card">
         <div class="card-header">Liste Patients</div>
         <div class="card-body">
             <form method="get"  th:action="@{index}">
                 <label>Keyword:</label>
                 <input type="text" name="keyword" th:value="${keyword}">
                 <button type="submit" class="btn btn-info">Search</button>
             </form>
             <table class="table">
                 <thead>
                 <tr>
                     <th>Id</th> <th>Nom</th> <th>Date</th> <th>Malade</th> <th>Score</th>
                 </tr>
                 <tr th:each="p:${listPatients}">
                     <td th:text="${p.id}"></td>
                     <td th:text="${p.nom}"></td>
                     <td th:text="${p.dateNaissance}"></td>
                     <td th:text="${p.malade}"></td>
                     <td th:text="${p.score}"></td>
                     <td>
                         <a onclick="javascript:return confirm('Etes vous sure ?')"
                            th:href="@{delete(id=${p.id},keyword=${keyword}, page=${currentPage})}" class="btn btn-danger">Delete</a>
                     </td>
                 </tr>
                 </thead>
             </table>
             <ul class="nav nav-pills">
                 <li th:each="v,item:${pages}">
                     <a th:href="@{/index(page=${item.index},keyword=${keyword})}"
                        th:class="${currentPage == item.index?'btn btn-info' : 'btn btn-outline-info'}"
                        th:text="${1+item.index}"></a>
                 </li>
             </ul>
         </div>
 </div>
 </div>

</body>
</html>
